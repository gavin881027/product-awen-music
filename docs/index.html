// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>
<script type="text/babel">
/* Awen Study — UI components. Loaded as Babel JSX. Exports to window. */
const { useState, useRef, useEffect } = React;

/* ---------- tiny inline icons (kept geometric, no hand-drawn art) ---------- */
function Icon({ name, size = 16 }) {
  const s = { width: size, height: size, strokeWidth: 1.6, fill: 'none',
              stroke: 'currentColor', strokeLinecap: 'round', strokeLinejoin: 'round' };
  const paths = {
    lock:   <><rect x="4" y="9" width="12" height="9" rx="1.5" /><path d="M6.5 9V6.5a3.5 3.5 0 0 1 7 0V9" /></>,
    unlock: <><rect x="4" y="9" width="12" height="9" rx="1.5" /><path d="M6.5 9V6.5a3.5 3.5 0 0 1 6.8-1.2" /></>,
    dice:   <><rect x="3" y="3" width="14" height="14" rx="3" /><circle cx="7" cy="7" r="1.1" fill="currentColor" stroke="none"/><circle cx="13" cy="13" r="1.1" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r="1.1" fill="currentColor" stroke="none"/></>,
    bolt:   <path d="M11 2 4 11h5l-1 7 7-9h-5z" />,
    copy:   <><rect x="6" y="6" width="10" height="11" rx="1.6" /><path d="M12 6V4.6A1.6 1.6 0 0 0 10.4 3H4.6A1.6 1.6 0 0 0 3 4.6v7A1.6 1.6 0 0 0 4.6 13H6" /></>,
    check:  <path d="M4 10.5 8 14.5 16 5.5" />,
    reset:  <><path d="M4 10a6 6 0 1 1 1.8 4.3" /><path d="M4 14v-3.2h3.2" /></>,
    wave:   <path d="M2 10c2 0 2-4 4-4s2 8 4 8 2-8 4-8 2 4 4 4" />,
    play:   <path d="M6 4l9 6-9 6z" fill="currentColor" stroke="none" />,
    image:  <><rect x="3" y="4" width="14" height="12" rx="2" /><circle cx="7.4" cy="8" r="1.3" /><path d="M3.5 14l4-3.4 3 2.4 3.2-3 2.8 2.6" /></>,
  };
  return <svg viewBox="0 0 20 20" style={s} aria-hidden="true">{paths[name]}</svg>;
}

/* ---------- a single selectable cell ---------- */
function Chip({ label, selected, fromRef, onClick, swatch }) {
  return (
    <button type="button"
      className={'chip' + (selected ? ' sel' : '') + (fromRef && !selected ? ' ref' : '')}
      onClick={onClick}>
      {swatch
        ? <span className="chip-swatch" style={{ background: `linear-gradient(135deg, ${swatch.join(', ')})` }} />
        : <span className="chip-dot" />}
      <span className="chip-label">{label}</span>
      {selected && <span className="chip-check"><Icon name="check" size={13} /></span>}
    </button>
  );
}

/* ---------- one dimension column ---------- */
function Column({ dim, value, onPick, showLock, locked, onToggleLock, refValue }) {
  const layerClass = dim.layer === 'production' ? ' col-prod' : (dim.layer === 'visual' ? ' col-visual' : '');
  const hex = window.AWEN.PALETTE_HEX;
  return (
    <div className={'col' + layerClass}>
      <div className="col-head">
        <div className="col-headL">
          <span className="col-code">{dim.code}</span>
          <span className="col-label">{window.I18N.isZh() ? (dim.zh || dim.label) : dim.label}</span>
        </div>
        {showLock && (
          <button type="button"
            className={'col-lock' + (locked ? ' on' : '')}
            title={locked ? '已锁定 — Shuffle 时保持不动\n点击解锁' : '未锁定 — Shuffle 时会随机替换\n点击锁定'}
            onClick={onToggleLock}>
            <Icon name={locked ? 'lock' : 'unlock'} size={14} />
          </button>
        )}
      </div>
      <div className="col-body">
        {dim.options.map(opt => (
          <Chip key={opt} label={opt} selected={value === opt}
            swatch={dim.key === 'palette' ? hex[opt] : null}
            fromRef={refValue === opt} onClick={() => onPick(dim.key, opt)} />

/* ---------- robust clipboard copy: works inside sandboxed iframes too ---------- */
async function copyText(text) {
  // 1) modern API (needs secure context + permission — often blocked in embedded preview)
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through */ }
  // 2) legacy execCommand via a temporary textarea
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

function reviewHash(input) {
  let hash = 2166136261;
  const text = String(input || '');
  for (let i = 0; i < text.length; i++) {
    hash ^= text.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return (hash >>> 0).toString(16).padStart(8, '0');
}

function toBase64Utf8(text) {
  return btoa(unescape(encodeURIComponent(String(text || ''))));
}

function fromBase64Utf8(value) {
  const raw = atob(String(value || '').replace(/\n/g, ''));
  const bytes = Uint8Array.from(raw, char => char.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}

function reviewSafeText(value) {
  return String(value || '').replace(/\r\n/g, '\n').trim();
}

function reviewListMarkdown(items) {

function validatePromptReviewResult(raw, review) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('审核 JSON 必须是对象。');
  const allowed = new Set(['id', 'sourceHash', 'decision', 'scores', 'revised', 'changes', 'risks', 'summary']);
  if (Object.keys(raw).some(key => !allowed.has(key))) throw new Error('审核 JSON 含有未支持字段。');
  if (raw.id !== review.id || raw.sourceHash !== review.sourceHash) throw new Error('审核结果不属于当前初稿（id 或 sourceHash 不匹配）。');
  const decisions = ['approve', 'approve_with_changes', 'needs_revision', 'reject'];
  if (!decisions.includes(raw.decision)) throw new Error('decision 必须为 approve、approve_with_changes、needs_revision 或 reject。');
  const scoreKeys = ['focus', 'dynamicStability', 'vocalSafety', 'warmth', 'loopability'];
  if (!raw.scores || typeof raw.scores !== 'object' || scoreKeys.some(key => !Number.isInteger(raw.scores[key]) || raw.scores[key] < 0 || raw.scores[key] > 10)) {
    throw new Error('scores 必须包含 5 个 0–10 整数评分。');
  }
  const revised = raw.revised || {};
  if (!['structure-prompt', 'instrumental'].includes(revised.lyricsRoute) || !reviewSafeText(revised.style) || !reviewSafeText(revised.exclude) || typeof revised.structurePrompt !== 'string') {
    throw new Error('revised 必须包含 lyricsRoute、非空 style、非空 exclude 和 structurePrompt。');
  }
  if (revised.lyricsRoute === 'instrumental' && reviewSafeText(revised.structurePrompt)) {
    throw new Error('Instrumental 路线的 structurePrompt 必须为空。');
  }
  const lowerExclude = revised.exclude.toLowerCase();
  const requiredExclude = SUNO_EXCLUDE_DEFAULT.split(',').map(item => item.trim().toLowerCase()).filter(Boolean);
  if (requiredExclude.some(item => !lowerExclude.includes(item))) {
    throw new Error('Exclude Styles 不能删除 Study With Me 基础排除项。');
  }
  if (!Array.isArray(raw.changes) || !Array.isArray(raw.risks) || raw.changes.length > 20 || raw.risks.length > 20 ||
      [...raw.changes, ...raw.risks].some(item => !reviewSafeText(item))) {
    throw new Error('changes 与 risks 必须是最多 20 条的非空文本数组。');
  }
  if (raw.summary != null && (typeof raw.summary !== 'string' || raw.summary.length > 2000)) throw new Error('summary 必须是不超过 2000 字符的文本。');
  return {
    id: raw.id,
    sourceHash: raw.sourceHash,
    decision: raw.decision,
    scores: Object.fromEntries(scoreKeys.map(key => [key, raw.scores[key]])),
    revised: {
      lyricsRoute: revised.lyricsRoute,
      style: reviewSafeText(revised.style),
      exclude: reviewSafeText(revised.exclude),
      structurePrompt: reviewSafeText(revised.structurePrompt),
    },
    changes: raw.changes.map(reviewSafeText),
    risks: raw.risks.map(reviewSafeText),
    summary: reviewSafeText(raw.summary || ''),
    reviewedAt: new Date().toISOString(),
  };
}

            <div className="suno-param"><span className="suno-param-label">STYLE INFLUENCE · Loose ↔ Strong</span><span className="suno-param-value">{normalized.styleInfluence}%</span></div>

}

/* ---------- Prompt review panel ---------- */
function PromptReviewPanel({ song, onSubmit, onCopyInstruction, onApply, onMarkApplied }) {
  const [reviewJson, setReviewJson] = React.useState('');
  const [applying, setApplying] = React.useState(false);
  const [markingApplied, setMarkingApplied] = React.useState(false);
  const review = song.promptReview;
  const statusLabel = {
    in_review: '待 ChatGPT 审核',
    approved: '已批准',
    applied_to_suno: '已应用 Suno',
    needs_revision: '需要修改',
    rejected: '未通过',
  }[review?.status] || '尚未提交';
  const apply = async () => {
    setApplying(true);
    try {
      const accepted = await onApply(song.id, reviewJson);
      if (accepted) setReviewJson('');
    } finally {
      setApplying(false);
    }
  };
  const markApplied = async () => {
    setMarkingApplied(true);
    try {
      await onMarkApplied(song.id);
    } finally {
      setMarkingApplied(false);
    }
  };
  return (
    <details className="suno-asset-fold prompt-review-fold">
      <summary>ChatGPT 审核 · {statusLabel}{review?.status === 'approved' && <span className="review-approved-check" aria-label="ChatGPT 审核已批准">✓</span>}{review?.status === 'applied_to_suno' && <span className="review-applied-star" aria-label="已应用 Suno">🌟</span>}</summary>
      <div className="suno-asset-body">
        <div className="settings-note" style={{marginBottom:10}}>
          {review
            ? <>初稿：<b>{review.sourcePath}</b> · sourceHash <b>{review.sourceHash}</b>{review.approvedPath && <> · 当前批准版本：<b>{review.approvedPath}</b></>}</>
            : '提交后会保存 Awen 初稿、生成 ChatGPT 审核指令，并保留所有批准版本。'}
        </div>
        <div className="settings-actions" style={{marginTop:0}}>
          <button className="settings-save-btn" onClick={() => onSubmit(song.id)}>
            {review ? '提交当前版本复审' : '提交 ChatGPT 审核'}
          </button>
          {review && <button className="settings-clear-btn" onClick={() => onCopyInstruction(song.id)}>复制 ChatGPT 审核指令</button>}
          {review?.status === 'approved' && <button className="settings-clear-btn" onClick={markApplied} disabled={markingApplied}>
            {markingApplied ? '正在同步…' : '标记为已应用 Suno'}
          </button>}
        </div>
        {review && <div className="block" style={{marginTop:12}}>
          <div className="block-head">
            <div className="block-labels">
              <span className="block-label">导入 ChatGPT 审核 JSON</span>
              <span className="field-hint">通过会生成批准版本；需要修改/拒绝只记录审核结论</span>
            </div>
          </div>
          <textarea className="settings-input" value={reviewJson}
            placeholder='粘贴符合 review-v1.json 的 ChatGPT 审核结果'
            onChange={e => setReviewJson(e.target.value)} style={{minHeight:150, resize:'vertical'}} />
          <div className="settings-actions">
            <button className="settings-save-btn" onClick={apply} disabled={!reviewJson.trim() || applying}>
              {applying ? '正在应用…' : '应用审核并推送'}
            </button>
          </div>
        </div>}
      </div>
    </details>
  );
}

/* ---------- one produced song ---------- */
function SongCard({ song, onStatus, onDelete, onPin, onRemix, onStar, onReviewSubmit, onReviewCopy, onReviewApply, onReviewMarkApplied }) {
  const A = window.AWEN;

    workspace: 'Awen · Singles',

  const tags = [...A.DIMS.map(d => ({ code: d.code, val: song.sel[d.key] })),
                { code: 'BPM', val: song.sel.bpm }];
  const status = song.status || 'Draft';
  const cycle = () => {
    const i = STATUS_ORDER.indexOf(status);

  return (
    <div className="card">
      <div className="card-head">
        <div className="card-headL">
          {song.releaseId

          {song.genTime && <span className="card-gentime">⏱ {song.genTime}s</span>}

              <span className="status-dot" />{T('st' + status)}

          {onRemix && (

              <button type="button" className="remix-btn" onClick={() => onRemix(song.sel)}>

          {onStar && !song.generating && song.ai && (
            <button type="button" className={"star-btn" + (song.starred ? " starred" : "")}
              title={song.starred ? "已收藏到曲库" : "收藏到曲库（本地优先）"}
              onClick={() => onStar(song)}>⭐</button>
          )}
          <button type="button" className={"icon-btn" + (song.pinned ? " on" : "")} title={song.pinned ? "已锁定 — 点击解锁" : "锁定 (防误删)"} onClick={() => { if (song.pinned) { if (window.confirm('确认解锁？解锁后此曲目可被删除。')) onPin(song.id); } else { onPin(song.id); } }} style={song.pinned ? {background:"var(--accent)",borderColor:"var(--accent)",color:"var(--accent-ink)",fontSize:"13px"} : {fontSize:"13px"}}>{song.pinned ? '🔒' : '🔓'}</button>
          {!song.pinned && <button type="button" className="icon-btn" title="Delete" onClick={() => onDelete(song.id)}>×</button>}
        </div>
      </div>

      {song.generating ? (
        <><div className="card-title dim">{window.I18N.isZh() ? '正在生成 Prompt…' : 'composing prompt…'}</div><Skeleton /></>
      ) : (
        <>
          <div className="card-title">{ai.title}</div>
          <div className="card-tagline">{ai.tagline}</div>

          <div className="tags">
            {tags.map(t => <span key={t.code} className="tag"><b>{t.code}</b>{t.val}</span>)}
          </div>

          <SunoBridgePanel recipe={sunoRecipe} promptId={song.id} />

          {onReviewSubmit && <PromptReviewPanel song={song} onSubmit={onReviewSubmit}
            onCopyInstruction={onReviewCopy} onApply={onReviewApply} onMarkApplied={onReviewMarkApplied} />}

          <details className="suno-asset-fold">
            <summary>发布素材 · Cover / Video / Thumbnail / 文件名 / YouTube</summary>
            <div className="suno-asset-body">
              {ai.cover && (
                <div className="block">
                  <div className="block-head">
                    <div className="block-labels">
                      <span className="block-label"><Icon name="image" size={12} /> COVER PROMPT</span>
                      <span className="field-hint">{T('coverHint')}</span>
                    </div>
                    <CopyBtn text={ai.cover} />
                  </div>
                  <div className="kv"><span className="v">{ai.cover}</span></div>
                </div>
              )}
              <div className="block">
                <div className="block-head">
                  <div className="block-labels">
                    <span className="block-label"><Icon name="play" size={12} /> VIDEO PROMPT</span>
                    <span className="field-hint">{T('videoHint')}</span>
                  </div>
                  <CopyBtn text={ai.video || ai.veo} />
                </div>
                <div className="kv"><span className="v">{ai.video || ai.veo}</span></div>
              </div>
              {ai.thumb && (
                <div className="block">
                  <div className="block-head">
                    <div className="block-labels">
                      <span className="block-label"><Icon name="image" size={12} /> {T('thumbLabel')}</span>
                      <span className="field-hint">{T('thumbHint')}</span>
                    </div>
                    <CopyBtn text={ai.thumb} />
                  </div>
                  <div className="kv"><span className="v">{ai.thumb}</span></div>
                </div>
              )}
              <div className="publish-helper">
                <div className="block">
                  <div className="block-head">
                    <div className="block-labels">
                      <span className="block-label"><Icon name="play" size={12} /> 文件名 / FILENAME</span>
                      <span className="field-hint">下载 Suno mp3 后改用此名</span>
                    </div>
                    <CopyBtn text={A.songFileName(song)} />
                  </div>
                  <div className="kv"><span className="v" style={{fontFamily:'var(--font-mono)'}}>{A.songFileName(song)}.wav</span></div>

                <div className="block">

                </div>
              </div>

}

<script type="text/babel">
/* Awen Study — Album mode: axis picker console + album result card. Babel JSX. */
const { useState: useStateAlb } = React;

/* ---------- the album-build console (replaces RecipeBar in album mode) ---------- */
/* ---------- V3 Scene console: Scene → Mood → Purpose → Album ---------- */

function AlbumConsole({ axisKey, count, base, busy, onAxis, onCount, onBuild }) {
  const A = window.AWEN;
  const axis = A.ALBUM_AXES.find(a => a.key === axisKey) || A.ALBUM_AXES[0];
  const moving = new Set(axis.moves);
  const capped = axis.maxTracks && count > axis.maxTracks;
  const effective = capped ? axis.maxTracks : count;
  const zh = window.I18N.isZh();
  const dimLabel = (k) => k === 'bpm' ? 'BPM' : (zh ? (A.DIMS.find(d => d.key === k)?.zh) : (A.DIMS.find(d => d.key === k)?.label)) || k;
  const movingLabels = axis.moves.map(dimLabel);
  const anchorLabels = A.anchorDims(axisKey).filter(k => !A.VISUAL_KEYS.includes(k)).map(dimLabel);
  const dna = A.visualDNA(base);
  const dnaHex = A.PALETTE_HEX[dna.palette] || ['#888'];

  return (
    <div className="albcon">
      <div className="albcon-axes">
        <div className="albcon-kicker">{T('axisKicker')}</div>
        <div className="axis-grid">
          {A.ALBUM_AXES.map(a => (
            <button key={a.key} type="button"
              className={'axis-btn' + (a.key === axisKey ? ' on' : '')}
              onClick={() => onAxis(a.key)}>
              <span className="axis-name">{a.label}</span>
              <span className="axis-zh">{zh ? a.zh : a.en}</span>
            </button>
          ))}
        </div>
      </div>

      <div className="albcon-side">
        <div className="anchor-readout">
          <div className="ar-row ar-move">
            <span className="ar-tag">{T('moving')}</span>
            <span className="ar-vals">{movingLabels.join(' · ')}</span>
          </div>
          <div className="ar-row ar-hold">
            <span className="ar-tag">{T('anchor')}</span>
            <span className="ar-vals">{anchorLabels.join(' · ')}</span>
          </div>
          <div className="ar-row ar-visual">
            <span className="ar-tag">{T('visualDna')}</span>
            <span className="ar-vals">
              <span className="dna-swatch" style={{ background: `linear-gradient(135deg, ${dnaHex.join(', ')})` }} />
              {dna.character} · {dna.light} · {dna.palette} · {dna.motif}
            </span>
          </div>
        </div>

        <div className="count-row">
          <span className="count-label">{T('tracksLabel')}</span>
          <div className="count-stepper">
            <button type="button" onClick={() => onCount(Math.max(3, count - 1))} disabled={busy}>−</button>
            <span className="count-n">{count}</span>
            <button type="button" onClick={() => onCount(Math.min(16, count + 1))} disabled={busy}>+</button>
          </div>
        </div>
        {capped && <div className="count-cap">{T('epCap', { n: axis.maxTracks })}</div>}

        <button type="button" className="btn btn-primary albcon-go" onClick={onBuild} disabled={busy}>
          <Icon name="bolt" size={16} />
          {busy ? T('buildAlbumBusy', { n: effective }) : T('buildAlbum', { n: effective })}
        </button>
      </div>
    </div>
  );
}

/* ---------- one produced album ---------- */

    () => (data && data.tracks) ? A.metadataGen(data, album.base || {}) : null,
    [data, album.base]
  );

    const i = STATUS_ORDER.indexOf(status);
    onStatus(album.id, STATUS_ORDER[(i + 1) % STATUS_ORDER.length]);

    style: tr.style || data?.anchor,

    title: tr.title,
    workspace: albumWorkspace,

  const albumDurationSec = data?.tracks?.reduce((sum, tr) => sum + trackRecipe(tr).durationSec, 0) || 0;
  const copyAll = data &&
`=== AWEN STUDY · ALBUM ===
${data.album}
${data.concept}

[ABOUT]
${data.description || ''}

[SAVE TO WORKSPACE]

const TAB_INTRO_DISMISS_KEY = 'awen_tab_intro_dismissed_v1';

function TabIntro({ mode }) {
  const zh = window.I18N.isZh();
  const intros = TAB_INTROS[zh ? 'zh' : 'en'];
  const intro = intros[mode];
  const [dismissed, setDismissed] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem(TAB_INTRO_DISMISS_KEY) || '{}'); } catch (e) { return {}; }
  });

  if (!intro) return null;
  const isDismissed = !!dismissed[mode];

  function dismiss() {
    const next = { ...dismissed, [mode]: true };
    setDismissed(next);
    try { localStorage.setItem(TAB_INTRO_DISMISS_KEY, JSON.stringify(next)); } catch (e) {}
  }
  function show() {
    const next = { ...dismissed }; delete next[mode];
    setDismissed(next);
    try { localStorage.setItem(TAB_INTRO_DISMISS_KEY, JSON.stringify(next)); } catch (e) {}
  }

  if (isDismissed) {
    return (
      <div className="tab-intro-show">
        <button className="tab-intro-show-btn" onClick={show}>
          ▾ {zh ? '展开本模式说明' : 'show tab guide'}
        </button>
      </div>
    );
  }

  return (
    <div className="tab-intro">
      <button className="tab-intro-close" onClick={dismiss} title={zh ? '收起' : 'hide'}>
        ✕ {zh ? '收起' : 'hide'}

function loadState() {

}

function promptIdNumber(id) {
  const match = String(id || '').match(/^AWN-(\d+)$/i);
  return match ? Number(match[1]) : 0;
}
function promptIdFor(sequence) {
  return `AWN-${String(Math.max(1, Number(sequence) || 1)).padStart(4, '0')}`;
}
function nextPromptSequence(items, savedSequence) {
  const highestAssigned = (items || []).reduce((highest, item) => Math.max(highest, promptIdNumber(item?.id)), 0);
  return Math.max(1, Number(savedSequence) || 1, highestAssigned + 1);
}
function normalizedSongTitle(value) {
  return String(value || '').trim().replace(/\s+/g, ' ').toLocaleLowerCase();
}
function uniqueSongTitle(title, promptId, items) {
  const base = String(title || promptId || 'Untitled').trim() || promptId || 'Untitled';
  const usedTitles = new Set((items || [])
    .filter(item => item?.id !== promptId && item?.ai?.title)
    .map(item => normalizedSongTitle(item.ai.title)));
  if (!usedTitles.has(normalizedSongTitle(base))) return base;
  let candidate = `${base} · ${promptId}`;
  let suffix = 2;
  while (usedTitles.has(normalizedSongTitle(candidate))) {
    candidate = `${base} · ${promptId}-${suffix++}`;
  }
  return candidate;
}

/* ========== AI PROVIDER CONFIG ========== */
const AI_PROVIDER_STORE_KEY = 'awen_ai_provider_v1';
const GH_REPO_DEFAULT = 'awenstudio/product-awen-music';
const PROMPT_REVIEW_REPO_DEFAULT = '';

function normalizeGitHubRepo(value) {
  const repo = String(value || '').trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/^\/+|\/+$/g, '');
  return /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo) ? repo : '';
}

const AI_PROVIDER_PRESETS = {
  'mimo': {
    label: 'MiMo', protocol: 'chat-completions',
    baseUrl: 'https://token-plan-cn.xiaomimimo.com/v1/chat/completions', model: 'mimo-v2.5-pro'
  },
  'opencode-go-chat': {
    label: 'OpenCode Go · GLM-5.3', protocol: 'chat-completions',
    baseUrl: 'https://opencode.ai/zen/go/v1/chat/completions', model: 'glm-5.3'
  },
  'opencode-go-mimo': {
    label: 'OpenCode Go · MiMo-V2.5-Pro', protocol: 'chat-completions',
    baseUrl: 'https://opencode.ai/zen/go/v1/chat/completions', model: 'mimo-v2.5-pro'
  },
  'opencode-go-deepseek-v4-pro': {
    label: 'OpenCode Go · DeepSeek V4 Pro', protocol: 'chat-completions',
    baseUrl: 'https://opencode.ai/zen/go/v1/chat/completions', model: 'deepseek-v4-pro'
  },
  'opencode-go-responses': {
    label: 'OpenCode Go · GPT-5.6 Luna', protocol: 'responses',
    baseUrl: 'https://opencode.ai/zen/go/v1/responses', model: 'gpt-5.6-luna'
  },
  'custom': {
    label: '自定义 / 中转站', protocol: 'chat-completions', baseUrl: '', model: ''
  },
};

function loadAIProviderConfig() {
  try {
    const saved = JSON.parse(localStorage.getItem(AI_PROVIDER_STORE_KEY) || 'null');
    if (saved && saved.baseUrl && saved.model) {
      const preset = AI_PROVIDER_PRESETS[saved.preset] || AI_PROVIDER_PRESETS.custom;
      // Named OpenCode Go presets are intentionally canonical. Older builds
      // allowed URL/protocol/model drift while keeping the official label.
      if (String(saved.preset || '').startsWith('opencode-go-')) {
        return { preset: saved.preset, ...preset, apiKey: String(saved.apiKey || '') };
      }
      return { ...preset, ...saved };
    }
  } catch (e) {}
  // One-time compatibility with the original MiMo-only build.
  let legacyKey = '';
  try { legacyKey = localStorage.getItem('mimo_api_key') || ''; } catch (e) {}
  return { preset: 'mimo', ...AI_PROVIDER_PRESETS.mimo, apiKey: legacyKey };
}

function saveAIProviderConfig(config) {
  const clean = {
    preset: config.preset || 'custom',
    label: String(config.label || 'Custom Provider').trim(),
    protocol: config.protocol === 'responses' ? 'responses' : 'chat-completions',
    baseUrl: String(config.baseUrl || '').trim().replace(/\/+$/, ''),
    model: String(config.model || '').trim(),
    apiKey: String(config.apiKey || '').trim(),
  };
  try { localStorage.setItem(AI_PROVIDER_STORE_KEY, JSON.stringify(clean)); } catch (e) {}
  return clean;
}

function providerEndpoint(config) {
  const base = String(config.baseUrl || '').trim().replace(/\/+$/, '');
  if (!base) return '';
  if (config.protocol === 'responses') {
    return /\/responses$/i.test(base) ? base : `${base}/responses`;
  }
  return /\/chat\/completions$/i.test(base) ? base : `${base}/chat/completions`;
}

function providerCredentialScope(providerId) {
  return String(providerId || '').startsWith('opencode-go-') ? 'opencode-go' : String(providerId || 'custom');
}

function providerErrorSummary(response, body) {
  const raw = String(body || '').trim();
  const contentType = String(response?.headers?.get('content-type') || '').toLowerCase();
  if (contentType.includes('text/html') || /^<!doctype html/i.test(raw) || /^<html/i.test(raw)) {
    return window.I18N.isZh()
      ? '上游返回了 HTML 页面，通常表示该模型路由暂时不可用'
      : 'The upstream returned HTML, which usually means the model route is temporarily unavailable';
  }
  try {
    const parsed = JSON.parse(raw);
    const message = parsed?.error?.message || parsed?.error || parsed?.message;
    if (typeof message === 'string' && message.trim()) return message.trim().slice(0, 240);
  } catch (e) {}
  const plain = raw.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
  return plain.slice(0, 240) || (window.I18N.isZh() ? '服务商未返回错误详情' : 'No error details returned');
}

function providerPayload(config, prompt) {
  if (config.protocol === 'responses') return { model: config.model, input: prompt };
  const payload = { model: config.model, messages: [{ role: 'user', content: prompt }] };
  // DeepSeek V4 Pro may otherwise return JSON-looking text with an
  // unterminated final string. Ask the OpenAI-compatible endpoint for strict
  // JSON and leave enough output room for the full Awen prompt package.
  if (config.preset === 'opencode-go-deepseek-v4-pro') {
    payload.response_format = { type: 'json_object' };
    payload.max_tokens = 8192;
    payload.thinking = { type: 'disabled' };
    payload.temperature = 0.35;
  }
  return payload;
}

/* ========== TOKEN MODAL ========== */
function TokenModal({ open, onSubmit, onCancel, providerLabel }) {
  const [val, setVal] = React.useState('');
  const [show, setShow] = React.useState(false);
  const inputRef = React.useRef(null);

  React.useEffect(() => {
    if (open) {
      setVal('');
      setTimeout(() => inputRef.current && inputRef.current.focus(), 80);
    }
  }, [open]);

  React.useEffect(() => {
    if (!open) return;
    const h = (e) => { if (e.key === 'Escape') onCancel(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [open, onCancel]);

  if (!open) return null;

  function submit() {
    if (val.trim()) onSubmit(val.trim());
  }

  return (
    <div className="modal-back" onClick={onCancel} role="dialog" aria-modal="true">
      <div className="modal-card" onClick={e => e.stopPropagation()}>
        <div className="modal-h">{window.I18N.isZh() ? '输入 API Key' : 'Enter API Key'}</div>
        <div className="modal-sub">
          {window.I18N.isZh()
            ? `当前 Provider：${providerLabel || 'MiMo'}。Key 只保存在本机浏览器。`
            : `Current provider: ${providerLabel || 'MiMo'}. The key stays in this browser.`}
        </div>
        <div className="modal-pw-row">
          <input ref={inputRef} type={show ? 'text' : 'password'}
            className="modal-pw-input" value={val}
            placeholder="sk-... / tp-..."
            onChange={e => setVal(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && submit()}
            autoComplete="current-password" />
          <button type="button" className="modal-pw-toggle" onClick={() => setShow(!show)}>
            {show ? T('tokenHide') : T('tokenShow')}
          </button>
        </div>
        <div className="modal-actions">
          <button type="button" className="modal-btn" onClick={onCancel}>{T('tokenCancel')}</button>
          <button type="button" className="modal-btn primary" onClick={submit} disabled={!val.trim()}>
            {T('tokenSubmit')}
          </button>
        </div>
      </div>
    </div>
  );
}

    const endpoint = providerEndpoint({ baseUrl, protocol });
    if (!endpoint || !model.trim()) {
      setProviderError('请填写 API Base URL 与模型名。');
      return;
    }
    try {
      const u = new URL(endpoint);
      const loopback = ['127.0.0.1', 'localhost', '::1'].includes(u.hostname);

                <span className="settings-hint">目标仓库（可填写你自己的 fork）</span>
                <input className="settings-input" value={repoVal} placeholder="owner/repo"
                  onChange={e => { setRepoVal(e.target.value); setPatError(''); }} />
              </label>
              {currentPat && <span className="settings-stored">已存储: ···{currentPat.slice(-6)}</span>}
              <input className="settings-input" type="password" value={patVal}
                placeholder="github_pat_xxxx..." onChange={e => setPatVal(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && savePat()} />
              {patError && <div className="settings-error">{patError}</div>}
              <button className="settings-save-btn" onClick={savePat} disabled={!normalizeGitHubRepo(repoVal)}>保存 GitHub 同步配置</button>
              <p className="settings-note">
                当前目标：<b>{currentRepo}</b>。Fine-grained PAT 必须选中同一个 Resource owner 与仓库，
                并授予 <b>Contents: Read and write</b>；组织仓库还可能需要管理员批准。<br/>
                <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer">
                  去 GitHub 生成 Fine-grained PAT →
                </a>
              </p>
            </div>
            <hr className="settings-divider" />
            <div className="settings-row">
              <span className="settings-label">Prompt 审核仓库 <span className="settings-hint">与收藏曲库分离；保存初稿、审核与批准版本</span></span>
              <label className="settings-field full">
                <span className="settings-hint">目标仓库</span>
                <input className="settings-input" value={reviewRepoVal} placeholder="owner/suno-prompt-chatgpt"
                  onChange={e => { setReviewRepoVal(e.target.value); setReviewError(''); }} />
              </label>
              {currentReviewPat
                ? <span className="settings-stored">审核专用 Key：已存储 ···{currentReviewPat.slice(-6)}</span>
                : currentPat
                  ? <span className="settings-hint">未填写审核专用 Key，将复用已存的收藏同步凭据。</span>
                  : <span className="settings-hint">请填写审核专用 Key，或先配置收藏同步凭据。</span>}
              <input className="settings-input" type="password" value={reviewPatVal}
                placeholder="可选：审核专用 github_pat_xxxx..." onChange={e => setReviewPatVal(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && saveReviewSync()} />
              {reviewError && <div className="settings-error">{reviewError}</div>}
              <button className="settings-save-btn" onClick={saveReviewSync} disabled={!normalizeGitHubRepo(reviewRepoVal)}>保存 Prompt 审核仓库</button>
              <p className="settings-note">
                当前目标：<b>{currentReviewRepo || '尚未配置'}</b>。建议为该仓库创建独立 Fine-grained PAT，
                仅授予 <b>Contents: Read and write</b>。不会保存 ChatGPT 对话、API Key 或其他凭据。
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ========== TOAST SYSTEM ========== */
function ToastContainer({ toasts, onClose, onAction }) {
  if (!toasts.length) return null;
  return (
    <div className="toast-container">
      {toasts.map(t => (
        <div key={t.id} className={'toast' + (t.kind === 'error' ? ' error' : '')} role="alert">
          <div className="toast-msg">
            {t.msg}
            {t.actionLabel && (
              <div className="toast-actions">
                <button className="toast-btn primary" onClick={() => onAction(t)}>{t.actionLabel}</button>
                <button className="toast-btn" onClick={() => onClose(t.id)}>{T('tokenCancel')}</button>
              </div>
            )}
          </div>
          {!t.actionLabel && <button className="toast-close" onClick={() => onClose(t.id)} aria-label="close">×</button>}
        </div>
      ))}
    </div>
  );
}

function App() {
  const A = window.AWEN;
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const saved = React.useRef(loadState()).current;
  const [mode, setMode] = React.useState(saved?.mode || 'scene');
  const [universes, setUniverses] = React.useState(() => A.loadUniverses());
  const [activeUniverseId, setActiveUniverseId] = React.useState(null);
  const [toasts, setToasts] = React.useState([]);
  const [tokenModalOpen, setTokenModalOpen] = React.useState(false);
  const [providerConfig, setProviderConfig] = React.useState(() => loadAIProviderConfig());
  const [hasKey, setHasKey] = React.useState(() => !!loadAIProviderConfig().apiKey);
  const [sunoDefaults, setSunoDefaults] = React.useState(() => loadSunoDefaults());
  const [bannerVal, setBannerVal] = React.useState('');
  function saveBannerKey() {
    const v = bannerVal.trim();
    if (!v) return;
    const cfg = saveAIProviderConfig({ ...loadAIProviderConfig(), apiKey: v });
    setProviderConfig(cfg);
    setHasKey(true);
    setBannerVal('');
    if (window.__awen_resolveToken) window.__awen_resolveToken(v);
  }
  const [settingsOpen, setSettingsOpen] = React.useState(false);
  const [libItems, setLibItems] = React.useState([]);
  const [libSha, setLibSha] = React.useState(null);
  const [libLoading, setLibLoading] = React.useState(false);
  const [libError, setLibError] = React.useState(null);

  // Listen for AI flow's request-token event
  React.useEffect(() => {
    const h = () => setTokenModalOpen(true);
    window.addEventListener('awen-need-token', h);
    return () => window.removeEventListener('awen-need-token', h);
  }, []);

  function pushToast(msg, opts = {}) {
    const id = Date.now() + Math.random();
    setToasts(prev => [...prev, { id, msg, kind: opts.kind || 'info', actionLabel: opts.actionLabel, action: opts.action }]);
    if (!opts.actionLabel) {
      setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), opts.duration || 5000);
    }
  }
  function dismissToast(id) { setToasts(prev => prev.filter(t => t.id !== id)); }
  function handleToastAction(t) { if (t.action) t.action(); dismissToast(t.id); }
  const [sel, setSel] = React.useState(saved?.sel ? { ...A.DEFAULTS, ...saved.sel } : { ...A.DEFAULTS });
  const [locks, setLocks] = React.useState(saved?.locks || {});
  const [songs, setSongs] = React.useState(() => (saved?.songs || []).map(song =>
    song.ai ? { ...song, ai: attachSongSunoRecipe(song.ai, sunoDefaults) } : song));
  const [albums, setAlbums] = React.useState(() => (saved?.albums || []).map(album =>
    album.data ? { ...album, data: attachAlbumSunoRecipes(album.data, sunoDefaults) } : album));
  const [axisKey, setAxisKey] = React.useState(saved?.axisKey || 'day');
  const [trackCount, setTrackCount] = React.useState(saved?.trackCount || 8);
  // V3 Scene-mode selections
  const [sceneKey, setSceneKey]     = React.useState(saved?.sceneKey   || 'rainy-library');
  const [moodKey, setMoodKey]       = React.useState(saved?.moodKey    || 'focused');
  const [purposeKey, setPurposeKey] = React.useState(saved?.purposeKey || 'study');
  const [albumSeq, setAlbumSeq] = React.useState(saved?.albumSeq || 1);
  const [seq, setSeq] = React.useState(() => nextPromptSequence(saved?.songs, saved?.seq));
  const [songPubSeq, setSongPubSeq] = React.useState(saved?.songPubSeq || 1);
  const [albumPubSeq, setAlbumPubSeq] = React.useState(saved?.albumPubSeq || 1);
  const [busy, setBusy] = React.useState(false);
  const [rolling, setRolling] = React.useState(false);
  const [showGuide, setShowGuide] = React.useState(false);
  const [lang, setLang] = React.useState(saved?.lang || 'zh');
  window.I18N.lang = lang; // set before children render so T() resolves correctly

  // Keep <html lang> in sync with current UI language (for a11y + search engines).
  React.useEffect(() => {
    try { document.documentElement.lang = (lang === 'zh' ? 'zh-CN' : 'en'); } catch (e) {}
  }, [lang]);

  // First-visit: auto-open the usage guide once.
  React.useEffect(() => {
    try {if (!localStorage.getItem(GUIDE_KEY)) {setShowGuide(true);localStorage.setItem(GUIDE_KEY, '1');}} catch (e) {}
  }, []);

  // persist
  // PERF: debounce localStorage writes — at most one write per 400ms, instead of
  // serializing the entire app state on every keystroke / status cycle / etc.
  const _writeTimer = React.useRef(null);
  React.useEffect(() => {
    if (_writeTimer.current) clearTimeout(_writeTimer.current);
    _writeTimer.current = setTimeout(() => {
      const clean = songs.filter((s) => !s.generating);
      const cleanAlb = albums.filter((a) => !a.generating);
      try { localStorage.setItem(STORE_KEY, JSON.stringify({ mode, sel, locks, songs: clean, albums: cleanAlb, seq, albumSeq, songPubSeq, albumPubSeq, axisKey, trackCount, sceneKey, moodKey, purposeKey, lang })); } catch (e) {}
    }, 400);
    return () => { if (_writeTimer.current) clearTimeout(_writeTimer.current); };
  }, [mode, sel, locks, songs, albums, seq, albumSeq, axisKey, trackCount, sceneKey, moodKey, purposeKey, lang]);

  function pick(key, val) {setSel((prev) => ({ ...prev, [key]: val }));}
  function toggleLock(key) {setLocks((prev) => ({ ...prev, [key]: !prev[key] }));}

  function switchMode(m) {
    setMode(m);
    if (m === 'decompose') setSel((prev) => ({ ...prev, ...A.REFERENCE.decomposed }));
  }

  function saveUniverse(u) {
    setUniverses(prev => { const next = [...prev, u]; A.saveUniversesStore(next); return next; });
  }
  function applyUniverse(u) {
    setSel(prev => ({ ...prev, character: u.character, light: u.light, palette: u.palette, motif: u.motif, environment: u.environment }));
    setActiveUniverseId(u.id);
  }
  function deleteUniverse(id) {
    setUniverses(prev => { const next = prev.filter(u => u.id !== id); A.saveUniversesStore(next); return next; });
  }

  function shuffle() {
    setRolling(true);
    let ticks = 0;
    const iv = setInterval(() => {
      setSel((prev) => {
        const next = { ...prev };
        A.DIMS.forEach((d) => {if (d.layer === 'visual') return; if (!locks[d.key]) next[d.key] = A.rand(d.options);});
        if (!locks.bpm) next.bpm = A.rand(A.BPM.values);
        return next;
      });
      if (++ticks >= 6) {clearInterval(iv);setRolling(false);}
    }, 55);
  }

  // Generic OpenAI-compatible provider. Local runs use server.py as a same-origin
  // proxy so providers that do not expose browser CORS (including OpenCode Go)
  // still work without putting API keys in the repository.
  const API_TIMEOUT_MS = 180000;

  // Safe localStorage wrappers — Safari private mode / quota errors will not crash the app.
  const safeLS = {
    get(k){ try { return localStorage.getItem(k); } catch(e) { return null; } },
    set(k,v){ try { localStorage.setItem(k,v); return true; } catch(e) { return false; } },
    del(k){ try { localStorage.removeItem(k); } catch(e) {} },
  };

  // GitHub library helpers
  const LOCAL_LIB_KEY = 'awen_local_library_v1';
  const GH_LIB_PATH = 'docs/library.json';
  function getGitHubRepo() {
    return normalizeGitHubRepo(safeLS.get('github_repo')) || GH_REPO_DEFAULT;
  }
  function hydrateLibraryItem(item) {
    if (!item || !item.id) return item;
    if (item.type === 'song' || item.sel) {
      let recipe = item.sunoRecipe;
      if (!recipe && item.sel) {
        const fallback = A.fallbackPrompt(item.sel);
        recipe = buildSunoRecipe(fallback.suno, item.title || fallback.title, 'Awen · Singles', SUNO_RECIPE_DEFAULTS);
      }
      return { ...item, type: 'song', sunoRecipe: normalizeSunoRecipe(recipe, {
        title: item.title,
        workspace: 'Awen · Singles',
      }) };
    }
    const workspace = item.workspace || `Awen · ${item.title || 'Untitled Album'}`;
    const recipes = Array.isArray(item.sunoRecipes)
      ? item.sunoRecipes.map(recipe => normalizeSunoRecipe(recipe, { workspace }))
      : [];
    return { ...item, type: 'album', workspace, sunoRecipes: recipes };
  }
  function readLocalLibrary() {
    try {
      const parsed = JSON.parse(safeLS.get(LOCAL_LIB_KEY) || 'null');
      return Array.isArray(parsed?.songs) ? parsed.songs.map(hydrateLibraryItem).filter(Boolean) : [];
    } catch (e) { return []; }
  }
  function writeLocalLibrary(items) {
    return safeLS.set(LOCAL_LIB_KEY, JSON.stringify({ version: 2, songs: items.map(hydrateLibraryItem) }));
  }
  function mergeLibraryItems(remoteItems, localItems) {
    const merged = new Map();
    [...(remoteItems || []), ...(localItems || [])].forEach(item => {
      if (item?.id) merged.set(item.id, item);
    });
    return [...merged.values()].sort((a, b) => String(b.savedAt || '').localeCompare(String(a.savedAt || '')));
  }
  function githubSyncMessage(error) {
    const repo = getGitHubRepo();
    if (error?.status === 403) {
      return `GitHub 无权写入 ${repo}。请让 PAT 选中该仓库并授予 Contents: Read and write；组织仓库可能还需管理员批准。`;
    }
    return error?.message || 'GitHub 同步失败';
  }
  async function ghFetch(method, url, body, token) {
    const pat = token || safeLS.get('github_pat');
    if (!pat) throw new Error('需要 GitHub PAT');
    const res = await fetch(url, {
      method,
      headers: { Authorization: `Bearer ${pat}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(body ? { 'Content-Type': 'application/json' } : {}) },
      ...(body ? { body: JSON.stringify(body) } : {}),
    });
    if (!res.ok) {
      const raw = await res.text();
      let detail = '';
      try { detail = JSON.parse(raw)?.message || ''; } catch (e) {}
      const error = new Error(`GitHub ${res.status}: ${detail || '请求失败'}`);
      error.status = res.status;
      throw error;
    }
    return res.json();
  }
  async function loadLibrary() {
    setLibLoading(true); setLibError(null);
    const localItems = readLocalLibrary();
    setLibItems(localItems);
    if (!safeLS.get('github_pat')) { setLibLoading(false); return; }
    try {
      const data = await ghFetch('GET', `https://api.github.com/repos/${getGitHubRepo()}/contents/${GH_LIB_PATH}`);
      const parsed = JSON.parse(atob(data.content.replace(/\n/g, '')));
      const merged = mergeLibraryItems((parsed.songs || []).map(hydrateLibraryItem), localItems);
      setLibItems(merged); writeLocalLibrary(merged); setLibSha(data.sha);
    } catch (e) {
      if (e.status === 404) { setLibItems(localItems); setLibSha(null); }
      else { setLibItems(localItems); setLibError(`GitHub 同步失败，当前显示本地收藏。${githubSyncMessage(e)}`); }
    }
    setLibLoading(false);
  }
  async function _writeLibrary(items, sha) {
    const json = JSON.stringify({ version: 2, songs: items.map(hydrateLibraryItem) }, null, 2);
    const content = btoa(unescape(encodeURIComponent(json)));
    const res = await ghFetch('PUT', `https://api.github.com/repos/${getGitHubRepo()}/contents/${GH_LIB_PATH}`,
      { message: `update library (${items.length} items)`, content, ...(sha ? { sha } : {}) });
    setLibSha(res.content.sha);
  }
  async function addToLibrary(item) {
    const pat = safeLS.get('github_pat');
    const isSong = !!item.sel;
    const ai = item.ai || item.data || {};
    const entry = {
      id: item.id, type: isSong ? 'song' : 'album',
      title: ai.title || (item.data?.tracks?.[0]?.title) || item.id,
      tagline: ai.tagline || item.axisLabel || '',
      sel: item.sel || null,
      genTime: item.genTime || null,
      createdAt: item.createdAt || null,
      savedAt: new Date().toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }),
      publishedAt: null,
      ...(isSong ? {
        sunoRecipe: normalizeSunoRecipe(item.ai?.suno?.recipe, {
          lyrics: item.ai?.suno?.lyrics || item.ai?.suno?.structure,
          style: item.ai?.suno?.style,
          exclude: item.ai?.suno?.exclude,
          title: ai.title || item.id,
          workspace: 'Awen · Singles',
        }),
      } : {
        workspace: item.data?.workspace || `Awen · ${item.data?.album || ai.title || item.id}`,
        sunoRecipes: (item.data?.tracks || []).map(track => normalizeSunoRecipe(track.sunoRecipe, {
          lyrics: track.lyrics,
          style: track.style || item.data?.anchor,
          exclude: track.exclude,
          title: track.title,
          workspace: item.data?.workspace || `Awen · ${item.data?.album || item.id}`,
        })),
      }),
    };
    const localItems = readLocalLibrary();
    const localIdx = localItems.findIndex(x => x.id === item.id);
    const localUpdated = localIdx >= 0
      ? localItems.map((x, i) => i === localIdx ? { ...x, ...entry } : x)
      : [entry, ...localItems];
    if (!writeLocalLibrary(localUpdated)) {
      pushToast('本地收藏失败：浏览器存储不可用或空间不足。', { kind: 'error' });
      return;
    }
    setLibItems(prev => mergeLibraryItems(prev, localUpdated));
    setSongs(prev => prev.map(s => s.id === item.id ? { ...s, starred: true } : s));
    setAlbums(prev => prev.map(a => a.id === item.id ? { ...a, starred: true } : a));

    if (!pat) {
      pushToast(`⭐ 已在本机收藏「${entry.title}」；如需跨设备，可在设置中开启 GitHub 同步。`);
      return;
    }

    // Always read the latest SHA, then merge local and remote favourites.
    let remoteItems = [], curSha = null;
    try {
      const data = await ghFetch('GET', `https://api.github.com/repos/${getGitHubRepo()}/contents/${GH_LIB_PATH}`);
      const parsed = JSON.parse(atob(data.content.replace(/\n/g, '')));
      remoteItems = parsed.songs || []; curSha = data.sha;
    } catch (e) {
      if (e.status !== 404) {
        pushToast(`⭐ 已在本机收藏「${entry.title}」；${githubSyncMessage(e)}`, { kind: 'warn', duration: 10000 });
        return;
      }
    }
    const updated = mergeLibraryItems(remoteItems, localUpdated);
    try {
      await _writeLibrary(updated, curSha);
      setLibItems(updated);
      writeLocalLibrary(updated);
      pushToast(`⭐ 已收藏「${entry.title}」并推送到 GitHub`);
    } catch (e) {
      pushToast(`⭐ 已在本机收藏「${entry.title}」；${githubSyncMessage(e)}`, { kind: 'warn', duration: 10000 });
    }
  }
  async function removeFromLibrary(id) {
    const updated = libItems.filter(x => x.id !== id);
    writeLocalLibrary(updated);
    setLibItems(updated);
    setSongs(prev => prev.map(s => s.id === id ? { ...s, starred: false } : s));
    setAlbums(prev => prev.map(a => a.id === id ? { ...a, starred: false } : a));
    if (!safeLS.get('github_pat')) { pushToast('已从本机曲库移除'); return; }
    try {
      await _writeLibrary(updated, libSha);
      pushToast('已从本机与 GitHub 曲库移除');
    } catch (e) { pushToast(`已从本机曲库移除；${githubSyncMessage(e)}`, { kind: 'warn', duration: 10000 }); }
  }
  async function setPublishedAt(id, date) {
    const updated = libItems.map(x => x.id === id ? { ...x, publishedAt: date } : x);
    writeLocalLibrary(updated); setLibItems(updated);
    if (!safeLS.get('github_pat')) return;
    try { await _writeLibrary(updated, libSha); }
    catch (e) { pushToast(`发布日期已保存在本机；${githubSyncMessage(e)}`, { kind: 'warn', duration: 10000 }); }
  }

  // Prompt review sync is deliberately separate from the favourites library.
  // It stores versioned Markdown artifacts and a small manifest; no API keys,
  // cookies, or conversation transcripts are included in those artifacts.
  const REVIEW_MANIFEST_PATH = 'manifest.json';
  function getPromptReviewRepo() {
    return normalizeGitHubRepo(safeLS.get('prompt_review_github_repo')) || PROMPT_REVIEW_REPO_DEFAULT;
  }
  function getPromptReviewToken() {
    return safeLS.get('prompt_review_github_pat') || safeLS.get('github_pat');
  }
  function promptReviewSyncMessage(error) {
    const repo = getPromptReviewRepo() || '审核仓库';
    if (error?.status === 403 || error?.status === 404) {
      return `GitHub 无权访问 ${repo}。请在设置中确认审核仓库，并让 PAT 授予 Contents: Read and write。`;
    }
    return error?.message || 'Prompt 审核同步失败';
  }
  function reviewContentUrl(path) {
    const repo = getPromptReviewRepo();
    if (!repo) throw new Error('请先在设置中配置 Prompt 审核仓库。');
    const safePath = String(path || '').split('/').map(encodeURIComponent).join('/');
    return `https://api.github.com/repos/${repo}/contents/${safePath}`;
  }
  async function reviewGhFetch(method, path, body) {
    const token = getPromptReviewToken();
    if (!token) throw new Error('需要 GitHub PAT；请先配置收藏同步凭据或审核专用 PAT。');
    return ghFetch(method, reviewContentUrl(path), body, token);
  }
  async function readReviewFile(path) {
    try {
      const data = await reviewGhFetch('GET', path);
      return { sha: data.sha, text: fromBase64Utf8(data.content || '') };
    } catch (e) {
      if (e.status === 404) return null;
      throw e;
    }
  }
  async function writeReviewFile(path, text, message, sha) {
    return reviewGhFetch('PUT', path, {
      message,
      content: toBase64Utf8(text),
      ...(sha ? { sha } : {}),
    });
  }
  async function readReviewManifest() {
    const remote = await readReviewFile(REVIEW_MANIFEST_PATH);
    if (!remote) return { sha: null, manifest: { version: 1, updatedAt: null, prompts: [] } };
    try {
      const parsed = JSON.parse(remote.text);
      return {
        sha: remote.sha,
        manifest: {
          version: 1,
          updatedAt: parsed.updatedAt || null,
          prompts: Array.isArray(parsed.prompts) ? parsed.prompts : [],
        },
      };
    } catch (e) {
      throw new Error('审核仓库的 manifest.json 不是有效 JSON。');
    }
  }
  async function upsertReviewManifest(review) {
    const remote = await readReviewManifest();
    const entry = {
      key: review.key,
      id: review.id,
      title: review.title,
      status: review.status,
      sourceHash: review.sourceHash,
      sourceFile: review.sourcePath,
      latestReviewFile: review.latestReviewPath || null,
      approvedFile: review.approvedPath || null,
      applicationFile: review.applicationPath || null,
      appliedAt: review.appliedAt || null,
      reviewCount: review.reviewCount || 0,
      updatedAt: new Date().toISOString(),
    };
    const index = remote.manifest.prompts.findIndex(item => item?.key === review.key);
    const prompts = index < 0
      ? [entry, ...remote.manifest.prompts]
      : remote.manifest.prompts.map((item, i) => i === index ? { ...item, ...entry } : item);
    const manifest = { version: 1, updatedAt: entry.updatedAt, prompts };
    await writeReviewFile(REVIEW_MANIFEST_PATH, JSON.stringify(manifest, null, 2) + '\n',
      `review: update manifest for ${review.id}`, remote.sha);
  }
  function reviewRepoReady() {
    if (!getPromptReviewRepo()) {
      pushToast('请先在 ⚙ 设置中填写 Prompt 审核仓库。', { kind: 'warn', duration: 8000 });
      return false;

  // API key is requested via a React modal on first use, then stored in localStorage.
  // Keep the pending resolver across React re-renders. Opening TokenModal
  // triggers a render; a plain local variable would be reset and Cancel could
  // leave generation stuck forever instead of falling back to templates.
  const tokenResolverRef = React.useRef(null);
  function requestTokenViaModal() {
    return new Promise((resolve) => {
      tokenResolverRef.current = resolve;
      window.dispatchEvent(new CustomEvent('awen-need-token'));
    });
  }
  function resolveToken(token) {
    if (tokenResolverRef.current) {

  async function getProviderWithKey() {
    let cfg = loadAIProviderConfig();
    if (!cfg.apiKey) {

  function providerText(data) {
    const chat = data?.choices?.[0]?.message?.content;
    if (typeof chat === 'string') return chat;
    if (Array.isArray(chat)) {
      const joined = chat.map(x => typeof x === 'string' ? x : (x?.text || '')).join('');
      if (joined) return joined;
    }
    if (typeof data?.output_text === 'string') return data.output_text;
    if (Array.isArray(data?.output)) {
      const joined = data.output.flatMap(item => Array.isArray(item?.content) ? item.content : [])
        .map(part => typeof part?.text === 'string' ? part.text : '').join('');
      if (joined) return joined;
    }
    return '';
  }

  async function callProvider(endpoint, apiKey, payload, signal) {
    const isLocalApp = ['127.0.0.1', 'localhost'].includes(window.location.hostname);
    if (isLocalApp) {
      return fetch('/api/llm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ endpoint, apiKey, payload }),
        signal,
      });
    }
    return fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
      body: JSON.stringify(payload),
      signal,
    });
  }

  async function complete(prompt) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), API_TIMEOUT_MS);
    try {
      const cfg = await getProviderWithKey();
      if (!cfg.apiKey) throw new Error(window.I18N.isZh() ? '需要 API Key 才能使用 AI 生成' : 'API Key required for AI generation');
      const endpoint = providerEndpoint(cfg);
      if (!endpoint || !cfg.model) throw new Error(window.I18N.isZh() ? '请先在设置中配置 Provider URL 与模型' : 'Configure provider URL and model first');
      const payload = providerPayload(cfg, prompt);
      let activeCfg = cfg;
      let r = await callProvider(endpoint, cfg.apiKey, payload, ctrl.signal);

      // Luna can occasionally fail upstream with an HTML 404 while the Go
      // gateway and subscription key remain valid. Retry once through another
      // documented Go model, then remember the working preset.
      if (r.status === 404 && cfg.preset === 'opencode-go-responses') {
        await r.text().catch(() => '');
        const fallback = AI_PROVIDER_PRESETS['opencode-go-mimo'];
        activeCfg = { preset: 'opencode-go-mimo', ...fallback, apiKey: cfg.apiKey };
        const fallbackPayload = providerPayload(activeCfg, prompt);
        r = await callProvider(providerEndpoint(fallback), cfg.apiKey, fallbackPayload, ctrl.signal);
        if (r.ok) {
          const savedFallback = saveAIProviderConfig(activeCfg);
          setProviderConfig(savedFallback);
          setHasKey(true);
          pushToast(window.I18N.isZh()
            ? 'Luna 路由返回 404，已自动切换到 OpenCode Go · MiMo-V2.5-Pro。'
            : 'Luna returned 404; switched automatically to OpenCode Go · MiMo-V2.5-Pro.',
          { duration: 8000 });
        }
      }
      if (r.status === 503 && cfg.preset === 'opencode-go-deepseek-v4-pro') {
        await r.text().catch(() => '');
        await new Promise(resolve => setTimeout(resolve, 1500));
        r = await callProvider(endpoint, cfg.apiKey, payload, ctrl.signal);
      }
      if (r.status === 401) {
        const cleared = saveAIProviderConfig({ ...activeCfg, apiKey: '' });
        setProviderConfig(cleared); setHasKey(false);
        throw new Error(window.I18N.isZh() ? `${activeCfg.label} API Key 无效（401）` : `${activeCfg.label} API key invalid (401)`);
      }
      if (r.status === 402) {
        throw new Error(window.I18N.isZh() ? `${activeCfg.label} 余额或额度不足（402）` : `${activeCfg.label} balance or quota exhausted (402)`);
      }
      if (!r.ok) {
        const err = await r.text().catch(() => '');
        throw new Error(`${activeCfg.label} ${r.status}: ${providerErrorSummary(r, err)}`);
      }
      const data = await r.json();
      const text = providerText(data);
      if (!text) throw new Error(`${activeCfg.label} returned empty response`);
      return text;
    } catch (e) {
      if (e.name === 'AbortError') throw new Error(T('aiTimeout'));
      if (e instanceof TypeError && /fetch/i.test(e.message || '')) {
        throw new Error(window.I18N.isZh()
          ? 'Provider 请求失败。请使用本地启动脚本，并检查 URL、网络或中转站状态。'
          : 'Provider request failed. Run the local launcher and check URL/network/provider status.');
      }
      throw e;
    } finally {
      clearTimeout(t);
    }
  }
