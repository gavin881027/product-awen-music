TRACKS ${startIdx + 1}–${startIdx + batch.length} of ${total}:
${lines}

Each track: "style" carries sound + SCENE imagery (place, weather, light, time) + mood + texture, threads the shared motif (in words, never note names), and ends with the long-form words "${A.V3_LONGFORM}". Leave "lyrics" as the bare reference skeleton — the app fills it for the optional Prompt experiment; put NO prose/imagery in lyrics.

Return ONLY a minified JSON ARRAY (no wrapper), exactly ${batch.length} items:
[{"title":"","scene":"2-4 words","role":"","key":"","style":"genre + instrument + motif + scene imagery + mood + texture + long-form words","motifMark":"intro|variation|return|null","prompt":""}]
Calm, warm, instrumental, no vocals.`;
  }

  async function callAlbumAI(axis, base, recipes) {
    const total  = recipes.length;
    const b1Size = Math.ceil(total / 3);
    const b2Size = Math.ceil((total - b1Size) / 2);
    const batch1 = recipes.slice(0, b1Size);
    const batch2 = recipes.slice(b1Size, b1Size + b2Size);
    const batch3 = recipes.slice(b1Size + b2Size);

    // ── Step 1: metadata + first batch (serial) ──────────────────────────────
    const raw1 = await complete(_metaBatchPrompt(axis, base, batch1, b1Size, total));
    const s1 = raw1.indexOf('{'), e1 = raw1.lastIndexOf('}');
    if (s1 < 0 || e1 < 0) throw new Error('batch 1: no JSON');
    const j1 = JSON.parse(raw1.slice(s1, e1 + 1));
    if (!j1.album || !Array.isArray(j1.tracks)) throw new Error('batch 1: bad shape');

    const meta = {
      album: j1.album, axis: axis.label,
      anchor: j1.anchor || '', coreMotif: A.cleanMotif(j1.coreMotif, base.instrument),
      dna: j1.dna || A.albumDNA(base),
    };

    // ── Step 2: remaining batches in parallel ─────────────────────────────────
    const [raw2, raw3] = await Promise.all([
      batch2.length ? complete(_trackBatchPrompt(meta, batch2, b1Size, total))           : Promise.resolve('[]'),
      batch3.length ? complete(_trackBatchPrompt(meta, batch3, b1Size + b2Size, total)) : Promise.resolve('[]'),
    ]);

    const parseBatch = (raw) => {
      const a = raw.indexOf('['), b = raw.lastIndexOf(']');
      return (a >= 0 && b >= 0) ? JSON.parse(raw.slice(a, b + 1)) : [];
    };

    const allRaw = [...j1.tracks, ...parseBatch(raw2), ...parseBatch(raw3)];

    return {
      album:         String(j1.album).slice(0, 60),
      concept:       String(j1.concept       || ''),
      theme:         String(j1.theme         || j1.concept || ''),
      story:         String(j1.story         || j1.description || ''),
      atmosphere:    String(j1.atmosphere    || A.sceneAtmosphere(base)),
      bpm:           base.bpm,
      sceneLabel:    base._scene ? base._scene.label : '',
      description:   String(j1.description   || ''),
      descriptionZh: String(j1.description_zh || ''),
      anchor:        A.ensureLongform(String(j1.anchor || '')),
      coreMotif:     meta.coreMotif,
      dna:           meta.dna,
      visual:        A.visualDNA(base),
      cover:         String(j1.cover  || ''),
      video:         String(j1.video  || ''),
      thumb:         String(j1.thumb  || A.thumbRules(base)),
      tracks:        allRaw.map((t, i) => _parseTrack(t, i, recipes)),
    };
  }

  async function buildAlbum() {
    if (busy) return;
    const { axis, recipes } = A.buildAlbum(axisKey, sel, trackCount);
    const id = 'ALB-' + String(albumSeq).padStart(3, '0');
    setAlbumSeq((n) => n + 1);
    setAlbums((prev) => [{ id, axisLabel: axis.label, base: { ...sel }, universeId: activeUniverseId, status: 'Draft', generating: true }, ...prev]);
    setBusy(true);
    let data = null;
    const _albStart = Date.now();
    try {data = await callAlbumAI(axis, sel, recipes);} catch (e) {
      pushToast(T('aiFailed') + ' — ' + e.message + '  (已切换模板引擎)', { kind: 'warn' });
      data = null;
    }
    const albGenTime = data ? ((Date.now() - _albStart) / 1000).toFixed(1) : null;
    if (!data) data = A.fallbackAlbum(axisKey, sel, recipes);
    data = attachAlbumSunoRecipes(data, sunoDefaults);
    setAlbums((prev) => prev.map((x) => x.id === id ? { ...x, generating: false, data, genTime: albGenTime, createdAt: new Date().toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) } : x));
    setBusy(false);
  }

  // V3 Scene → Album: map Scene/Mood/Purpose to a full recipe, then run the
  // existing (V3) album engine. The "day" axis gives a natural dawn→night arc.
  async function buildSceneAlbum() {
    if (busy) return;
    const base = A.sceneToBase(sceneKey, moodKey, purposeKey);
    const { axis, recipes } = A.buildAlbum('day', base, trackCount);
    const scene = A.V3_SCENES.find(s => s.key === sceneKey);
    const id = 'ALB-' + String(albumSeq).padStart(3, '0');
    setAlbumSeq((n) => n + 1);
    setAlbums((prev) => [{ id, axisLabel: scene ? scene.label : axis.label, base: { ...base }, universeId: null, status: 'Draft', generating: true }, ...prev]);
    setBusy(true);
    let data = null;
    const _scnStart = Date.now();
    try { data = await callAlbumAI(axis, base, recipes); } catch (e) {
      pushToast(T('aiFailed') + ' — ' + e.message + '  (已切换模板引擎)', { kind: 'warn' });
      data = null;
    }
    const scnGenTime = data ? ((Date.now() - _scnStart) / 1000).toFixed(1) : null;
    if (!data) data = A.fallbackAlbum('day', base, recipes);
    data = attachAlbumSunoRecipes(data, sunoDefaults);
    setAlbums((prev) => prev.map((x) => x.id === id ? { ...x, generating: false, data, genTime: scnGenTime, createdAt: new Date().toLocaleString('zh-CN', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }) } : x));
    setBusy(false);
  }

  function remixSong(recipeSel) {
    setSel(prev => ({ ...prev, ...recipeSel }));
    switchMode('pick');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function setAlbumStatus(id, status) {
    setAlbums((prev) => prev.map((a) => {
      if (a.id !== id) return a;
      if (status === 'Published' && !a.releaseId) {
        const rid = 'ALB-' + String(albumPubSeq).padStart(3, '0');
        setAlbumPubSeq(n => n + 1);
        return { ...a, status, releaseId: rid };
      }
      return { ...a, status };
    }));
  }
  function setPinAlbum(id) {setAlbums((prev) => prev.map((a) => a.id === id ? { ...a, pinned: !a.pinned } : a));}
  function removeAlbum(id) {setAlbums((prev) => prev.filter((a) => a.pinned || a.id !== id));}

  const showLock = mode === 'shuffle';
  const sampleRef = A.REFERENCE;

  return (
    <div className="app" data-theme={t.theme} data-density={t.density} data-mode={mode}>
      <SettingsModal open={settingsOpen} onClose={() => setSettingsOpen(false)}
        onProviderSaved={(cfg) => { setProviderConfig(cfg); setHasKey(!!cfg.apiKey); }}
        sunoDefaults={sunoDefaults} onSunoDefaultsSaved={setSunoDefaults} />
      <TokenModal open={tokenModalOpen}
        providerLabel={providerConfig.label}
        onSubmit={(v) => { setTokenModalOpen(false); window.__awen_resolveToken(v); }}
        onCancel={() => { setTokenModalOpen(false); window.__awen_resolveToken(''); }} />
      <ToastContainer toasts={toasts} onClose={dismissToast} onAction={handleToastAction} />
      {!hasKey && (
        <div className="key-banner">
          <span className="key-banner-label">🔑 {window.I18N.isZh() ? `${providerConfig.label} · 填入 API Key` : `${providerConfig.label} · Enter API Key`}</span>
          <input className="key-banner-input" type="password" value={bannerVal}
            placeholder="sk-... / tp-..." onChange={e => setBannerVal(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && saveBannerKey()} />
          <button className="key-banner-btn" onClick={saveBannerKey}>{window.I18N.isZh() ? '保存' : 'Save'}</button>
          <button className="key-banner-btn" onClick={() => setSettingsOpen(true)}>{window.I18N.isZh() ? '更换 Provider' : 'Change Provider'}</button>
        </div>
      )}
      {/* top bar */}
      <header className="topbar">
        <div className="brand">
          <div className="brand-mark">Awen</div>
          <div className="brand-sub">MATRIX GENERATOR</div>
        </div>
        <div className="modes">
          {Object.keys(MODE_INFO).map((m) => {
            const tips = {pick:'手动点选每个维度，拼出一首歌的配方',shuffle:'锁定满意的列，点 Shuffle 随机生成其余维度',decompose:'从参考曲反推配方，逐项变异做 remix',album:'锁定声音身份 + 选行进轴，一次生成整张专辑'};
            return (
              <Tooltip key={m} text={tips[m]}>
                <button type="button"
                  className={'mode-btn' + (mode === m ? ' on' : '')}
                  aria-pressed={mode === m}
                  onClick={() => switchMode(m)}>{MODE_INFO[m].label}
                </button>
              </Tooltip>
            );
          })}
        </div>
        <button type="button" className="help-btn" onClick={() => setShowGuide(true)}>
          <span className="help-q">?</span> {T('help')}
        </button>
        <button type="button" className="settings-btn" title="设置 (AI Provider / GitHub PAT)" onClick={() => setSettingsOpen(true)}>⚙</button>
        <div className="lang-toggle">
          <button type="button" className={'lang-opt' + (lang === 'zh' ? ' on' : '')}
          onClick={() => setLang('zh')}>中</button>
          <button type="button" className={'lang-opt' + (lang === 'en' ? ' on' : '')}
          onClick={() => setLang('en')}>EN</button>
        </div>
        <div className="topstat">
          <span className="topstat-n">{(mode === 'album' || mode === 'scene') ? albums.filter((a) => !a.generating).length : songs.filter((s) => !s.generating).length}</span>
          <span className="topstat-l">{(mode === 'album' || mode === 'scene') ? T('albumsBuilt') : T('songsProduced')}</span>
        </div>
      </header>

      <div className="mode-hint">{T({ scene: 'hintScene', pick: 'hintPick', shuffle: 'hintShuffle', decompose: 'hintDecompose', album: 'hintAlbum', library: 'hintLibrary' }[mode])}</div>

      <TabIntro mode={mode} />

      {/* presets — quick start for beginners */}
      {(mode === 'pick' || mode === 'shuffle' || mode === 'album') &&
      <div className="presets">
        <span className="presets-label">{T('presetsLabel')}</span>
        {A.PRESETS.map((p) =>
        <button key={p.key} type="button" className="preset-btn"
          onClick={() => setSel((prev) => ({ ...prev, ...p.sel }))}
          title={p.label}>
          <span className="preset-icon">{p.icon}</span>
          <span className="preset-name">{lang === 'zh' ? p.zh : p.label}</span>
        </button>
        )}
      </div>
      }

      {/* reference card in decompose mode */}
      {mode === 'decompose' &&
      <ReferenceCard sample={sampleRef} sel={sel}
      onReset={() => setSel((prev) => ({ ...prev, ...sampleRef.decomposed }))}
      onApply={() => setSel((prev) => ({ ...prev, ...sampleRef.decomposed }))}
      onParse={(parsed) => setSel((prev) => ({ ...prev, ...parsed }))} />
      }

      {/* the matrix board — grouped into the three identity layers */}
      <div className={'board-stack' + (rolling ? ' rolling' : '')}>
        <section className="board-group">
          <div className="board-group-h"><span className="bg-label">{T('layerContent')}</span></div>
          <div className="board">
            {A.DIMS.filter((d) => d.layer === 'content').map((d) =>
            <Column key={d.key} dim={d} value={sel[d.key]} onPick={pick}
            showLock={showLock} locked={!!locks[d.key]} onToggleLock={() => toggleLock(d.key)}
            refValue={mode === 'decompose' ? sampleRef.decomposed[d.key] : null} />
            )}
          </div>
        </section>

        <section className="board-group">
          <div className="board-group-h"><span className="bg-label">{T('layerProduction')}</span></div>
          <div className="board">
            {A.DIMS.filter((d) => d.layer === 'production').map((d) =>
            <Column key={d.key} dim={d} value={sel[d.key]} onPick={pick}
            showLock={showLock} locked={!!locks[d.key]} onToggleLock={() => toggleLock(d.key)}
            refValue={mode === 'decompose' ? sampleRef.decomposed[d.key] : null} />
            )}
            <BpmColumn bpm={A.BPM} value={sel.bpm} onPick={pick}
            showLock={showLock} locked={!!locks.bpm} onToggleLock={() => toggleLock('bpm')} />
          </div>
        </section>

        <section className="board-group board-group-visual">
          <div className="board-group-h">
            <span className="bg-label">{T('layerVisual')}</span>
            <span className="bg-hint">{T('layerVisualHint')}</span>
          </div>
          <div className="board">
            {A.DIMS.filter((d) => d.layer === 'visual').map((d) =>
            <Column key={d.key} dim={d} value={sel[d.key]} onPick={pick}
            showLock={showLock} locked={!!locks[d.key]} onToggleLock={() => toggleLock(d.key)}
            refValue={mode === 'decompose' ? sampleRef.decomposed[d.key] : null} />
            )}
          </div>
          <UniverseBuilder sel={sel} universes={universes}
            onSave={saveUniverse} onApply={applyUniverse} onDelete={deleteUniverse}
            activeUniverseId={activeUniverseId} albums={albums} inline />
        </section>
      </div>

      {/* console — scene mode shows Scene→Mood→Purpose; album mode the axis builder */}
      {mode === 'scene' ?
      <SceneConsole sceneKey={sceneKey} moodKey={moodKey} purposeKey={purposeKey}
      count={trackCount} busy={busy}
      onScene={setSceneKey} onMood={setMoodKey} onPurpose={setPurposeKey}
      onCount={setTrackCount} onBuild={buildSceneAlbum} /> :
      mode === 'album' ?
      <AlbumConsole axisKey={axisKey} count={trackCount} base={sel} busy={busy}
      onAxis={setAxisKey} onCount={setTrackCount} onBuild={buildAlbum} /> :

      <RecipeBar sel={sel} mode={mode} busy={busy} mutations={A.mutations(sel)}
      onGenerate={generate} onShuffle={shuffle} />
      }

      {/* active universe strip */}
      {mode === 'album' && activeUniverseId && (() => {
        const u = universes.find(x => x.id === activeUniverseId);
        if (!u) return null;
        const seriesAlbums = albums.filter(a => a.universeId === activeUniverseId && !a.generating);
        return (
          <div className="series-strip">
            <span className="series-label">UNIVERSE</span>
            <span className="series-chip">♾ {u.name}</span>
            {seriesAlbums.length > 0 && <>
              <span className="series-label" style={{marginLeft:8}}>SERIES ({seriesAlbums.length})</span>
              {seriesAlbums.map(a => (
                <span key={a.id} className="series-album-chip">{a.id} · {a.axisLabel}</span>
              ))}
            </>}
          </div>
        );
      })()}

      {/* production feed */}
      {(mode === 'album' || mode === 'scene') ?
      <div className="feed">
          <div className="feed-head">
            <span className="feed-title">{T('albumShelf')}</span>
            {albums.length > 0 &&
          <button type="button" className="feed-clear" onClick={() => setAlbums((prev) => prev.filter((a) => a.pinned))}>{T('clearAll')}</button>
          }
          </div>
          {albums.length === 0 ?
        <div className="empty">
              <Icon name="wave" size={22} />
              <p>{T('emptyAlbum')}</p>
            </div> :

        <div className="albshelf">
              {albums.map((a) =>
          <AlbumCard key={a.id} album={a} onStatus={setAlbumStatus} onDelete={removeAlbum} onPin={setPinAlbum} onStar={addToLibrary} />
          )}
            </div>
        }
        </div> :

      <div className="feed">
          <div className="feed-head">
            <span className="feed-title">{T('prodFeed')}</span>
            {songs.length > 0 &&
          <button type="button" className="feed-clear" onClick={() => setSongs((prev) => prev.filter((s) => s.pinned))}>{T('clearAll')}</button>
          }
          </div>
          {songs.length === 0 ?
        <div className="empty">
              <Icon name="wave" size={22} />
              <p>{T('emptySong')}</p>
            </div> :

        <div className="feed-list">
              {songs.map((s) =>
          <SongCard key={s.id} song={s} onStatus={setStatus} onDelete={removeSong} onPin={setPinSong} onRemix={remixSong} onStar={addToLibrary}
            onReviewSubmit={submitPromptReview} onReviewCopy={copyPromptReviewInstruction} onReviewApply={applyPromptReview} onReviewMarkApplied={markPromptReviewApplied} />
          )}
            </div>
        }
        </div>
      }

      {/* Library */}
      {mode === 'library' && (
        <div className="lib-section">
          <div className="lib-header">
            <span className="lib-title">{libItems.length > 0 ? `${libItems.length} 首收藏` : '曲库'}</span>
            <button className="lib-refresh-btn" onClick={loadLibrary} disabled={libLoading}>↺ 刷新</button>
          </div>
          {libLoading && <div className="empty"><p>正在从 GitHub 读取曲库…</p></div>}
          {libError && <div className="empty"><b>读取失败</b><p>{libError}</p>
            {libError.includes('PAT') && <button className="key-banner-btn" style={{marginTop:8}} onClick={() => setSettingsOpen(true)}>⚙ 去设置填入 PAT</button>}
          </div>}
          {!libLoading && !libError && libItems.length === 0 && (
            <div className="empty">
              <b>曲库是空的</b>
              <p>在任意歌曲 / 专辑卡片上点 ⭐，会先保存到当前浏览器。</p>
              {!safeLS.get('github_pat') && <button className="key-banner-btn" style={{marginTop:8}} onClick={() => setSettingsOpen(true)}>⚙ 可选：设置 GitHub 跨设备同步</button>}
            </div>
          )}
          {!libLoading && libItems.length > 0 && (
            <div className="feed-list">
              {libItems.map(item => (
                <LibCard key={item.id} item={item}
                  onRemove={removeFromLibrary}
                  onSetPublished={(id, date) => setPublishedAt(id, date)} />
              ))}
            </div>
          )}
        </div>
      )}

      {/* Tweaks */}
      <TweaksPanel title="Tweaks">
        <TweakSection label="Look" />
        <TweakRadio label="Theme" value={t.theme}
        options={['console', 'lofi', 'clean', 'studio']}
        onChange={(v) => setTweak('theme', v)} />
        <TweakRadio label="Density" value={t.density}
        options={['compact', 'regular']}
        onChange={(v) => setTweak('density', v)} />
        <TweakSection label="Engine" />
      </TweaksPanel>
      <Guide open={showGuide} onClose={() => setShowGuide(false)} />
    </div>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
