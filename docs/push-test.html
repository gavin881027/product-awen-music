<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Awen GitHub 只读同步诊断</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    body { max-width: 820px; margin: 42px auto; padding: 0 20px; background: #11151d; color: #e7edf7; line-height: 1.6; }
    button { border: 0; border-radius: 9px; padding: 10px 14px; cursor: pointer; font: inherit; font-weight: 700; background: #68d2ea; color: #09232b; }
    button:disabled { opacity: .5; cursor: wait; } pre { white-space: pre-wrap; padding: 16px; border: 1px solid #2e3c50; border-radius: 12px; background: #171e29; }
  </style>
</head>
<body>
  <h1>GitHub 收藏同步：只读诊断</h1>
  <p>此页面只发送 GET 请求，不会创建、修改或删除任何 GitHub 文件。它检查主应用实际使用的 <code>docs/library.json</code>。</p>
  <button id="run">开始只读检查</button>
  <pre id="out">等待检查。</pre>
<script>
(() => {
  'use strict';
  const GH_LIB_PATH = 'docs/library.json';
  const DEFAULT_REPO = 'awenstudio/product-awen-music';
  const out = document.querySelector('#out'); const button = document.querySelector('#run');
  const lines = []; const add = text => { lines.push(text); out.textContent = lines.join('\n'); };
  const normalizeRepo = value => {
    const repo = String(value || '').trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/^\/+|\/+$/g, '');
    return /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(repo) ? repo : '';
  };
  async function run() {
    lines.length = 0; button.disabled = true;
    const repo = normalizeRepo(localStorage.getItem('github_repo')) || DEFAULT_REPO;
    const pat = localStorage.getItem('github_pat');
    add('=== Awen GitHub 只读同步诊断 ==='); add(`仓库：${repo}`); add(`文件：${GH_LIB_PATH}`); add(`PAT：${pat ? '当前地址已配置（不显示内容）' : '当前地址未配置'}`); add('');
    if (!pat) { add('未找到 PAT。请在与本页相同的协议、主机和端口下打开 Awen 主页面并保存设置。不同端口及 localhost/127.0.0.1 的浏览器存储彼此隔离。'); button.disabled = false; return; }
    const headers = { Authorization: `Bearer ${pat}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    try {
      add('步骤 1：读取仓库信息（GET）…');
      const repoResponse = await fetch(`https://api.github.com/repos/${repo}`, { headers }); add(`  HTTP ${repoResponse.status}`);
      if (!repoResponse.ok) { add(`  无法读取仓库：${(await repoResponse.text()).slice(0, 400)}`); return; }
      const info = await repoResponse.json(); add(`  仓库：${info.full_name}`); add(`  写入权限标志：${info.permissions?.push ? 'push=true' : 'push=false 或未返回'}`);
      add('步骤 2：读取收藏文件（GET）…');
      const path = GH_LIB_PATH.split('/').map(encodeURIComponent).join('/');
      const fileResponse = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, { headers }); add(`  HTTP ${fileResponse.status}`);
      if (fileResponse.status === 404) { add(`  未找到 ${GH_LIB_PATH}。这可能是文件尚未创建，也可能是 PAT 无权访问私有仓库；本页不会尝试创建文件。`); return; }
      if (!fileResponse.ok) { add(`  读取失败：${(await fileResponse.text()).slice(0, 400)}`); return; }
      const file = await fileResponse.json(); add(`  找到文件：${file.path}`); add(`  SHA：${String(file.sha || '').slice(0, 12)}…`); add(`  大小：${file.size ?? '未知'} bytes`); add(''); add('完成：本次仅发送 GET 请求，未写入 GitHub。');
    } catch (error) { add(`网络或浏览器错误：${error.message || error}`); }
    finally { button.disabled = false; }
  }
  button.addEventListener('click', run);
})();
</script>
</body>
</html>
